<!doctype html>
<html
	lang="en"
	data-theme="dark"
>
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>404 - Page Not Found | Joke Teller</title>
		<link
			rel="stylesheet"
			href="style.css"
		/>
		<style>
			.error-page {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				text-align: center;
				padding: var(--space-8);
				gap: var(--space-4);
			}

			.error-page__emoji {
				font-size: 6rem;
				animation: bounce 2s ease-in-out infinite;
			}

			.error-page__title {
				font-size: 2rem;
				font-weight: 700;
				background: var(--gradient-accent);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
			}

			.error-page__message {
				color: var(--color-text-secondary);
				max-width: 400px;
				line-height: 1.6;
			}
		</style>
	</head>
	<body>
		<div class="error-page">
			<div
				class="error-page__emoji"
				aria-hidden="true"
			>
				🤖
			</div>
			<h1 class="error-page__title">404 — Page Not Found</h1>
			<p class="error-page__message">
				The robot couldn't find that page. Maybe it wandered off looking for
				better jokes...
			</p>
			<a
				href="/"
				class="btn btn--primary"
			>
				← Back to Jokes
			</a>
		</div>
	</body>
</html>
