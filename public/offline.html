<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Offline — Joke Teller</title>
		<link rel="icon" type="image/png" href="favicon.png" />
		<link rel="stylesheet" href="style.css" />
		<style>
			.offline-page {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				gap: var(--space-6);
				padding: var(--space-8);
				text-align: center;
			}
			.offline-page__emoji {
				font-size: 4rem;
			}
			.offline-page__title {
				font-size: 1.5rem;
				font-weight: 700;
				background: var(--gradient-accent);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
			}
			.offline-page__message {
				color: var(--color-text-secondary);
				font-size: 1rem;
				line-height: 1.7;
				max-width: 380px;
			}
		</style>
	</head>
	<body>
		<div class="offline-page">
			<span class="offline-page__emoji" aria-hidden="true">🤖</span>
			<h1 class="offline-page__title">You're offline</h1>
			<p class="offline-page__message">
				The robot needs an internet connection to fetch jokes.<br />
				Check your connection and try again.
			</p>
			<button
				class="btn btn--primary btn--large"
				onclick="window.location.reload()"
			>
				Try again
			</button>
		</div>
	</body>
</html>
