<!doctype html>
<html
	lang="en"
	data-theme="dark"
>
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<meta
			name="description"
			content="An AI comedy robot that tells jokes with text-to-speech, categories, and a saved jokes collection."
		/>
		<meta
			name="theme-color"
			content="#6366f1"
		/>
		<meta
			name="robots"
			content="index, follow"
		/>

		<!-- Open Graph / Social sharing -->
		<meta
			property="og:type"
			content="website"
		/>
		<meta
			property="og:title"
			content="Joke Teller | AI Comedy Robot"
		/>
		<meta
			property="og:description"
			content="An AI comedy robot that tells jokes with text-to-speech, categories, and a saved jokes collection."
		/>
		<meta
			property="og:url"
			content="https://get-joke-f9568.web.app"
		/>

		<title>Joke Teller | AI Comedy Robot</title>

		<!-- PWA manifest & icons -->
		<link
			rel="manifest"
			href="manifest.json"
		/>
		<link
			rel="icon"
			type="image/png"
			href="favicon.png"
		/>
		<link
			rel="apple-touch-icon"
			href="icon-192.png"
		/>

		<!-- Fonts -->
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
			rel="stylesheet"
		/>

		<link
			rel="stylesheet"
			href="style.css"
		/>
	</head>
	<body>
		<div
			class="app"
			id="app"
		>
			<!-- ── HEADER ─────────────────────────────────────────── -->
			<header class="header">
				<div class="header__brand">
					<span
						class="header__logo"
						aria-hidden="true"
					>
						🤖
					</span>
					<h1 class="header__title">Joke Teller</h1>
				</div>

				<div class="header__actions">
					<!-- Running count of jokes heard this session -->
					<div
						class="jokes-heard-badge"
						title="Total jokes heard"
					>
						<span aria-hidden="true">😂</span>
						<span
							class="jokes-heard-badge__count"
							id="totalJokesHeardCount"
						>
							0
						</span>
					</div>

					<!-- Toggle between dark and light theme -->
					<button
						class="btn btn--icon"
						id="themeToggleBtn"
						aria-label="Toggle dark/light mode"
						title="Toggle theme"
					>
						<span
							class="icon--sun"
							aria-hidden="true"
						>
							☀️
						</span>
						<span
							class="icon--moon"
							aria-hidden="true"
						>
							🌙
						</span>
					</button>

					<!-- Open the saved jokes sidebar -->
					<button
						class="btn btn--icon"
						id="savedJokesToggleBtn"
						aria-label="Open saved jokes"
						aria-expanded="false"
						aria-controls="savedJokesSidebar"
						title="Saved jokes"
					>
						<span aria-hidden="true">❤️</span>
						<span
							class="notification-badge"
							id="savedJokesCount"
						>
							0
						</span>
					</button>
				</div>
			</header>

			<!-- ── MAIN CONTENT ───────────────────────────────────── -->
			<main class="main">
				<!-- Robot image + sound wave animation -->
				<section
					class="robot-section"
					aria-label="Robot mascot"
				>
					<div
						class="robot"
						id="robotWrapper"
					>
						<img
							src="robot.gif"
							alt=""
							class="robot__image"
						/>
					</div>

					<!-- Five bars that animate while the robot is speaking -->
					<div
						class="sound-wave"
						id="soundWave"
						aria-hidden="true"
					>
						<span></span>
						<span></span>
						<span></span>
						<span></span>
						<span></span>
					</div>
				</section>

				<!-- Joke display card -->
				<section
					class="joke-card"
					aria-label="Current joke"
				>
					<!-- Category badge (e.g. "💻 Coding") -->
					<span
						class="joke-card__category-badge"
						id="jokeCategoryBadge"
					>
						Ready
					</span>

					<div class="joke-card__body">
						<!-- sr-only live region: announced once with the full joke text.
						     Kept separate from the typewriter elements so screen readers
						     hear the complete joke, not one character at a time. -->
						<p
							id="jokeAnnouncement"
							class="sr-only"
							aria-live="polite"
							aria-atomic="true"
						></p>

						<!-- Two-part joke: setup shown first, punchline after a pause -->
						<p
							class="joke-card__setup"
							id="jokeSetupText"
							hidden
						></p>
						<p
							class="joke-card__punchline"
							id="jokePunchlineText"
							hidden
						></p>

						<!-- Single-line joke -->
						<p
							class="joke-card__single-text"
							id="jokeSingleText"
						>
							Click the button below to hear a joke! 🎤
						</p>
					</div>

					<!-- Per-joke actions: save, share, copy -->
					<div class="joke-card__actions">
						<button
							class="btn btn--ghost"
							id="saveJokeBtn"
							aria-label="Save joke to collection"
							title="Save joke"
							disabled
						>
							<span id="saveJokeIcon">🤍</span>
						</button>

						<button
							class="btn btn--ghost"
							id="shareJokeBtn"
							aria-label="Share this joke"
							title="Share joke"
							disabled
						>
							📤
						</button>

						<button
							class="btn btn--ghost"
							id="copyJokeBtn"
							aria-label="Copy joke to clipboard"
							title="Copy joke"
							disabled
						>
							📋
						</button>
					</div>
				</section>

				<!-- Category filter -->
				<section
					class="category-filter"
					aria-label="Filter jokes by category"
				>
					<h2 class="sr-only">Joke categories</h2>

					<div class="category-filter__buttons">
						<!--
					data-category must match the API slug exactly.
					Display labels are mapped in uiController (CATEGORY_LABELS).
				-->
						<button
							class="category-btn active"
							data-category="Any"
						>
							<span
								class="category-btn__icon"
								aria-hidden="true"
							>
								🎲
							</span>
							<span class="category-btn__label">Random</span>
						</button>

						<button
							class="category-btn"
							data-category="Programming"
						>
							<span
								class="category-btn__icon"
								aria-hidden="true"
							>
								💻
							</span>
							<span class="category-btn__label">Coding</span>
						</button>

						<button
							class="category-btn"
							data-category="Pun"
						>
							<span
								class="category-btn__icon"
								aria-hidden="true"
							>
								🥁
							</span>
							<span class="category-btn__label">Dad Jokes</span>
						</button>

						<button
							class="category-btn"
							data-category="Spooky"
						>
							<span
								class="category-btn__icon"
								aria-hidden="true"
							>
								👻
							</span>
							<span class="category-btn__label">Spooky</span>
						</button>

						<button
							class="category-btn"
							data-category="Christmas"
						>
							<span
								class="category-btn__icon"
								aria-hidden="true"
							>
								🎄
							</span>
							<span class="category-btn__label">Holiday</span>
						</button>

						<button
							class="category-btn"
							data-category="Misc"
						>
							<span
								class="category-btn__icon"
								aria-hidden="true"
							>
								🎭
							</span>
							<span class="category-btn__label">Miscellaneous</span>
						</button>
					</div>
				</section>

				<!-- Main action button -->
				<div class="action-section">
					<button
						class="btn btn--primary btn--large"
						id="tellJokeBtn"
						aria-label="Fetch and read a new joke"
					>
						<span class="btn__label">Tell Me a Joke</span>
						<span
							class="btn__spinner-label"
							aria-hidden="true"
						>
							<span class="spinner"></span>
							Loading…
						</span>
					</button>

					<!-- Voice selector -->
					<div class="voice-selector">
						<label
							for="voiceSelect"
							class="voice-selector__label"
						>
							🎤 Voice:
						</label>
						<select
							id="voiceSelect"
							class="voice-selector__dropdown"
						>
							<option value="">Loading voices...</option>
						</select>
						<button
							class="btn btn--ghost btn--sm"
							id="previewVoiceBtn"
							title="Preview voice"
							aria-label="Preview selected voice"
						>
							▶️
						</button>
					</div>

					<p
						class="keyboard-hint"
						aria-hidden="true"
					>
						⌨️ Keyboard:
						<kbd>Space</kbd>
						New joke &nbsp;|&nbsp;
						<kbd>F</kbd>
						Save &nbsp;|&nbsp;
						<kbd>C</kbd>
						Copy
					</p>
				</div>
			</main>

			<!-- ── SAVED JOKES SIDEBAR ────────────────────────────── -->
			<aside
				class="sidebar"
				id="savedJokesSidebar"
				aria-label="Saved jokes"
				aria-hidden="true"
				inert
			>
				<div class="sidebar__header">
					<h2 class="sidebar__title">❤️ Saved Jokes</h2>
					<button
						class="btn btn--icon"
						id="closeSidebarBtn"
						aria-label="Close saved jokes panel"
					>
						✕
					</button>
				</div>

				<div
					class="sidebar__body"
					id="savedJokesList"
				>
					<p
						class="sidebar__empty-message"
						id="savedJokesEmptyMsg"
					>
						No saved jokes yet.
						<br />
						Hit the 🤍 on any joke to save it here.
					</p>
				</div>

				<div class="sidebar__footer">
					<button
						class="btn btn--danger"
						id="clearSavedJokesBtn"
						hidden
					>
						🗑️ Clear All Saved Jokes
					</button>
				</div>
			</aside>

			<!-- Backdrop that closes the sidebar when clicked -->
			<div
				class="sidebar-overlay"
				id="sidebarOverlay"
				aria-hidden="true"
			></div>

			<!-- Toast notification container -->
			<div
				class="toast-container"
				id="toastContainer"
				role="status"
				aria-live="polite"
				aria-atomic="true"
			></div>

			<!-- Footer sits inside .app so margin-top: auto pushes it to the bottom -->
			<footer class="footer">
				<p>
					Made with 💜 by
					<strong>Avet Badalyan</strong>
					&nbsp;|&nbsp;
					<a
						href="https://github.com/AvetBadalyan"
						target="_blank"
						rel="noopener noreferrer"
					>
						GitHub
					</a>
				</p>
			</footer>
		</div>
		<!-- /.app -->

		<!-- ── SCRIPTS ─────────────────────────────────────────────
     Loaded in dependency order:
     config → storage → jokeService → audioController → uiController → app
──────────────────────────────────────────────────────────── -->
		<script src="js/config.js"></script>
		<script src="js/storage.js"></script>
		<script src="js/jokeService.js"></script>
		<script src="js/audioController.js"></script>
		<script src="js/uiController.js"></script>
		<script src="js/app.js"></script>

		<!-- PWA: register service worker -->
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker
						.register('service-worker.js')
						.catch(err =>
							console.warn('Service worker registration failed:', err)
						)
				})
			}
		</script>
	</body>
</html>
